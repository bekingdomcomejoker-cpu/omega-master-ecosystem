      - Added --no-notify flag and OMEGA_ENABLE_NOTIFY environment control.
      - Added healthcheck command.
      - Added OMEGA_GEMINI_MODEL override.
      - Logged local_only / clipboard_enabled / notify_enabled state into bus and state file.
