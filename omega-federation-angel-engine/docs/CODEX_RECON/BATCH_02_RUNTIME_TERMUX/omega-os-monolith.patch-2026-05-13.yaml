operator_value:
  - Can dry-run model/server discovery before starting anything.
  - Can force exact model/server paths.
  - Can test without clipboard or notifications.
  - Can force local-only mode for privacy/testing.
  - Can check local backend health directly.
  - Can stop/status/start local llama with one script.
source_preservation:
  - Runtime is preserved.
  - Default local-first behavior remains.
  - Gemini fallback remains available unless disabled.
  - Clipboard/notification behavior remains available unless disabled.
